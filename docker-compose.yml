services:
  postgres:
    image: postgres:16.14-alpine3.24
    container_name: mokara-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mokara
      POSTGRES_PASSWORD: mokara_password
      POSTGRES_DB: mokara
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mokara"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.9-alpine3.21
    container_name: mokara-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # PRD-11 Phase 1.3 dev storage: a local S3-COMPATIBLE endpoint, so task
  # attachments and workspace logos can be exercised the same way they will be
  # on a self-hosted instance. lib/storage.ts speaks plain S3 with
  # S3_FORCE_PATH_STYLE=1 (the default), which is exactly what MinIO expects —
  # no app code, CORS rule or presigned URL is involved (uploads are proxied).
  #
  # This is dev-only. It is NOT in the release path: CI builds the app images and
  # Coolify runs Postgres/Redis/storage as its own services. `docker compose up`
  # for this stays the owner's command.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: mokara-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      # Dev credentials, deliberately obvious. MINIO_ROOT_PASSWORD must be at
      # least 8 characters or the container refuses to start.
      MINIO_ROOT_USER: mokaraadmin
      MINIO_ROOT_PASSWORD: mokaramokara
    ports:
      - "9000:9000" # S3 API  → S3_ENDPOINT
      - "9001:9001" # web console → http://localhost:9001 (create the bucket here)
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  minio_data:
