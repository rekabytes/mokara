name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  checks:
    name: typecheck / lint / format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Prettier check
        run: pnpm format

      # The one step the pre-release audit proved belongs here. Typecheck runs
      # `tsc --noEmit`, so a build script that cannot emit passes CI forever —
      # which is how the backend's production build stayed broken for weeks. This
      # builds the artifact the frontend image actually runs.
      - name: Build frontend (standalone)
        run: pnpm build:frontend
